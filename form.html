<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <style>
        .container {
            background-color: antiquewhite;
            width: 500px;
            height: auto;
            border: 2px solid black;
            margin-left: 200px;
            margin-top: 200px;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        label {

            text-align: left;
            margin-left: 0px;
        }

        input {
            flex: 2;
            width: 150px;
        }

        button {
            margin-left: 0;
            display: block;
        }

        nav {
            display: flex;
            height: 90px;
            justify-content: space-around;
            align-items: center;
        }

        ul {
            margin: 0;
        }

        ul>li {
            list-style-type: none;
        }

        ul>li>a {
            text-decoration: none;
            color: #878484;
        }

        ul>li>a:hover {
            text-decoration: underline;
            color: red;
        }
      
        nav {
            background-color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
        }

        .logo img {
            width: 80px; 
            height: 150px; 
            object-fit: contain; 
        }
        .card img {
                width: 200px; 
                height: 300px;
                object-fit: cover;
                border-bottom: 1px solid #ddd; 
            }

    </style>
    <nav>
        <div class="logo">
            <img src="/img/logo.png" alt="logo"></div>
        <div class="d-flex gap-2 align-items-center">
            <div>
                <ul class="d-flex gap-5">
                    <li>
                        <a href="#">Trang chủ</a>
                    </li>
                    <li>
                        <a href="#">Thời trang nam</a>
                    </li>
                    <li>
                        <a href="#">Thời trang nữ</a>
                    </li>
                    <li>
                        <a href="#">Tin tức</a>
                    </li>
                </ul>
            </div>
            <div>
                <input type="text" placeholder= "Tim kiem">
          
            </div>
        </div>
    </nav>
    <div class="mt-3 w-90%">
        <h2 class="text-center" style="color: red;">Thời trang nữ</h2>
        <div class="row gap-2 justify-content-center" id="products">

        </div>
    </div>

    </div>

    <div class="container">
        <h1>SHOP DEBUG</h1>
        <form name="form2" id="form-product">
            <div class="form-group">
                <label for="type">Product Name:</label>
                <input type="text" name="pName" id="pName">
            </div>
        <div class="form-group">
                <label for="pQty">Product Quantity:</label>
                <input type="number" name="pQty" id="pQty">
            </div>

            <div class="form-group">
                <label for="nPrice">New price:</label>
                <input type="number" name="nPrice" id="nPrice">
            </div>
            <div class="form-group">
                <label for="oPrice">Old price:</label>
                <input type="number" name="oPrice" id="oPrice">
            </div>
            <div class="form-group">
                <label for="type">Type:</label>
                <input type="text" name="type" id="type">
            </div>
            <div class="form-group">
                <label for="pCode">Product's code:</label>
                <input type="text" name="pCode" id="pCode">
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <button type="button" onclick="Add()">Add</button>
            </div>

        </form>
    </div>

    <script>
        // Hàm hiển thị sản phẩm từ localStorage
        function displayProducts() {
            const elementProducts = document.getElementById('products');
            let products = localStorage.getItem("products") ? JSON.parse(localStorage.getItem('products')) : [];
            elementProducts.innerHTML = ''; // Xóa nội dung hiện tại
    
            products.forEach(element => {
                const el = `
                    <div class="card col-3" >
                        <div class="card-body">
                            <img src="${element.imgPath}" alt="" width="100%" height="100px">
                            <h3>${element.name}</h3>
                            <p>${element.newPrice}</p>
                            <button>Đặt mua</button>
                        </div>
                    </div>
                `;
                elementProducts.innerHTML += el;
            });
        }
    
        // Hàm thêm sản phẩm
        function Add() {
            let products = localStorage.getItem("products") ? JSON.parse(localStorage.getItem('products')) : [];
            const name = document.getElementById('pName').value;
            const quantity = document.getElementById('pQty').value;
            const newPrice = document.getElementById('nPrice').value;
            const oldPrice = document.getElementById('oPrice').value;
            const type = document.getElementById('type').value;
            const code = document.getElementById('pCode').value;
            const imgPath = './img/quan_jean.jpg';
    
            const product = {
                "name": name,
                "quantity": quantity,
                "newPrice": newPrice,
                "oldPrice": oldPrice,
                "type": type,
                "code": code,
                "imgPath": imgPath 
            };
    
            products.push(product);
            localStorage.setItem("products", JSON.stringify(products));
            
            // Hiển thị sản phẩm sau khi thêm
            displayProducts();
        }
    
        // Xóa toàn bộ dữ liệu trong localStorage (nếu cần)
        localStorage.clear();
    
        // Hiển thị sản phẩm khi trang được nạp
        displayProducts();
    </script>
    
</body>

</html>
